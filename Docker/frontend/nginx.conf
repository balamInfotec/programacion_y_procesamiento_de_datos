server {
    listen 80;
    server_name localhost;

    # Carpeta donde Nginx servirá los archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Manejo de rutas SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos (JS, CSS, imágenes, fuentes)
    location /assets/ {
        try_files $uri =404;
    }

    # Compresión gzip para mejorar rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cacheo de archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
